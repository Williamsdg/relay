<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16201a"/>
      <stop offset="1" stop-color="#0a0e0b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee88f"/>
      <stop offset="1" stop-color="#3aa854"/>
    </linearGradient>
  </defs>

  <!-- macOS icons sit on a rounded square; the squircle radius keeps it
       looking native next to system apps. -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Signal arcs: a relay is something a transmission passes through. -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M356 660 A 220 220 0 0 1 356 364" stroke-width="44" opacity="0.45"/>
    <path d="M668 364 A 220 220 0 0 1 668 660" stroke-width="44" opacity="0.45"/>
    <path d="M436 606 A 120 120 0 0 1 436 418" stroke-width="44" opacity="0.8"/>
    <path d="M588 418 A 120 120 0 0 1 588 606" stroke-width="44" opacity="0.8"/>
  </g>

  <circle cx="512" cy="512" r="66" fill="#7ee88f"/>
</svg>
